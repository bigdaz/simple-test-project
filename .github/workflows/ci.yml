name: Build and publish scan

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  DEVELOCITY_STORE_CONFIGURATION_CACHE: 'true'

jobs:
  build-and-publish-build-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@prerelease/repo-registration
      with:
        cache-read-only: false
        cache-encryption-key: 'AAAAAAAAAAAAAAAAAAAAAA=='
    - name: Run build
      run: ./gradlew build
